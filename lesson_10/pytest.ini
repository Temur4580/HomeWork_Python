[pytest]
; Маркеры для категоризации тестов
markers =
    smoke: Быстрая проверка критической функциональности
    regression: Полная регрессионная проверка
    calculator: Тесты калькулятора
    shop: Тесты интернет-магазина

; Настройки вывода
addopts =
    -v
    --strict-markers
    --alluredir=allure-results

; Пути для поиска тестов
testpaths = tests

; Убираем неизвестную опцию allure_dir (она не нужна)
; allure_dir = allure-results  ; Эту строку удаляем или комментируем
